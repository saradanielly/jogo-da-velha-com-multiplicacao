<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha com Multiplicação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2 class="titulo">Batalha da Multiplicação</h2>

        <div class="modo-jogo">
            <label for="modoJogo">Modo:</label>
            <select id="modoJogo">
                <option value="PvP">Jogador vs Jogador</option>
                <option value="PvC">Jogador vc Computador</option>
            </select>
        </div>

        <h1 id="pergunta">2 x 5 = ?</h1>

        <div class="resposta-box">
            <span> Quanto é?</span>
            <input id="resposta" type="number">
            <button onclick="responder()">OK</button>
        </div>

        <div class="placar">
            <div class="ponto">❌: <span id="pontosX">0</span></div>
            <div class="ponto">⭕: <span id="pontosO">0</span></div>
        </div>

        <div id="tabuleiro"></div>
        <p id="mensagem"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
