<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha com Multiplicação</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="media-query.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700;900&family=Shadows+Into+Light&family=Sriracha&display=swap">
</head>
<body>

    <div class="container">
        <h2 class="titulo">Batalha da Multiplicação</h2>

        <div class="modo-jogo">
            <label for="modoJogo">Modo:</label>
            <select id="modoJogo">
                <option value="PvP">Jogador vs Jogador</option>
                <option value="PvC">Jogador vs Computador</option>
            </select>
        </div>

        <h1 id="pergunta">2 x 5 = ?</h1>

        
            <form class="resposta-box" onsubmit="responder(); return false;">
                <span> Quanto é?</span>
                <input id="resposta" type="number">
                <button type="submit">OK</button>
            </form>
        
        <p id="mensagem"></p>
        <div class="placar">
            <div class="ponto">❌: <span id="pontosX">0</span></div>
            <div class="ponto">⭕: <span id="pontosO">0</span></div>
        </div>

        <div id="tabuleiro"></div>
        

        <div class="botoes-controle">
            <button onclick="reiniciarJogo()" class="botao-controle">Reiniciar</button>
            <button onclick="zerarPlacar()" class="botao-controle">Zerar Placar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
